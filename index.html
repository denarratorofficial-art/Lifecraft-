<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>LIFECRAFT</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><meta name="theme-color" content="#0f9d78"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="LIFECRAFT"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>
:root{--bg:#f1f4fa;--cd:#fff;--tx:#17203a;--mu:#6a7590;--ac:#0f9d78;--bad:#d64545;--bd:#d9dfec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--cd:#1a2234;--tx:#e8ecf5;--mu:#8e9ab3;--ac:#4fd1a5;--bad:#ff7070;--bd:#2a3550}}
:root[data-theme="dark"]{--bg:#0f1420;--cd:#1a2234;--tx:#e8ecf5;--mu:#8e9ab3;--ac:#4fd1a5;--bad:#ff7070;--bd:#2a3550}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif}*{box-sizing:border-box}
#app{max-width:720px;margin:auto;padding:10px 10px 80px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:0 0 10px}
h2,h3{margin:0 0 8px}h3{font-size:15px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
button{font:inherit;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:8px 12px;margin:2px;cursor:pointer}
button.s{background:transparent;color:var(--tx);border:1px solid var(--bd)}button:disabled{opacity:.4}
input,select,textarea{font:inherit;width:100%;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);margin:2px 0}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.r{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
.m{color:var(--mu);font-size:13px}.bad{color:var(--bad)}.ok{color:var(--ac)}
.bar{height:8px;background:var(--bd);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--cd);border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
nav button{background:none;color:var(--mu);font-size:12px;flex:1}nav button.on{color:var(--ac);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:4px;border-bottom:1px solid var(--bd);text-align:left}.sc{overflow-x:auto}
</style></head><body><div id="app"></div><script>
const SK='lifecraft_v1',cl=v=>Math.max(0,Math.min(100,Math.round(v)));
const M=n=>(n<0?'-':'')+'£'+(Math.abs(n)/100).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
const dt=n=>new Date(n*864e5),dN=(y,m,d)=>Math.floor(Date.UTC(y,m,d)/864e5);
const fmt=n=>dt(n).toUTCString().slice(0,16),isLast=n=>dt(n+1).getUTCDate()==1;
const SKL=['Customer service','Cooking','Driving','IT','Sales','Admin'],EDU={Secondary:0,'A-levels':5,Degree:12};
const V0=[[1,'Retail Assistant','Greenfield Stores','Manchester','Retail',1085,25,'Customer service',0,10,'Staff discount, 28 days leave'],
[2,'Kitchen Porter','Harbour Grill','Bristol','Hospitality',1100,30,'Cooking',0,8,'Free meals on shift'],
[3,'Warehouse Operative','QuickShip Logistics','Birmingham','Logistics',1190,40,'Driving',0,12,'Pension 3%'],
[4,'Care Assistant','BrightCare','Leeds','Healthcare',1215,37,'Customer service',0,14,'Paid training'],
[5,'Barista','Bean There','London','Hospitality',1140,28,'Cooking',0,10,'Free drinks'],
[6,'IT Support Technician','NorthNet','Manchester','Technology',1450,37,'IT',1,30,'Pension 5%, 25 days leave'],
[7,'Sales Executive','Apex Motors','Birmingham','Sales',1500,40,'Sales',1,28,'25 days leave'],
[8,'Admin Assistant','City Council','Leeds','Public sector',1300,37,'Admin',0,18,'Pension 6%, 28 days leave']
].map(a=>({id:a[0],t:a[1],e:a[2],loc:a[3],ind:a[4],r:a[5],h:a[6],sk:a[7],x:a[8],df:a[9],b:a[10],ct:'Permanent, monthly pay, 1 month probation',dl:0}));
const SHOP=[['Basic pack (rice, beans, veg) – 7 meals',700,7,8,0,0],['Fresh pack – 7 meals, healthier',1500,7,5,2,0],['Ready meals – 3 meals',900,3,10,0,0],['Takeaway (eat tonight, treat)',800,1,1,0,5]];
const Q=[['Why do you want this job?',[['Honest and enthusiastic answer',15],['Generic answer',6],['"It pays money"',0]]],['Tell us about a time you solved a problem.',[['Specific example with result',15],['Vague answer',5],['Blank mind',0]]]];
let TO='',G=null,tab='home',filt={i:'',q:''},ledF='bank',tr='';
function rnd(){let t=G.rs+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}
function log(t,imp){G.log.unshift({d:G.day,t});if(G.log.length>60)G.log.pop();if(imp)G.stop=true}
function newGame(o){const d0=dN(o.year,0,1),m=o.diff=='easy'?.9:o.diff=='hard'?1.1:1;
G={rs:o.seed||Date.now()%99999,d0,day:d0,name:o.name,age:o.age,edu:o.edu,diff:o.diff,sc:o.sc,m,cash:0,bank:0,led:[],arrears:[],food:[{n:14,exp:d0+14}],
st:{energy:80,health:90,happy:60,stress:20,rep:50},cv:{built:false,sk:[],x:0,ref:false},apps:[],invites:[],offers:[],job:null,slips:[],log:[],vac:JSON.parse(JSON.stringify(V0)),
q:[],claim:false,nextJsa:0,worked:0,absM:0,used:0,sick:false,dec:null,int:null,ach:{},stop:false,firstBill:dN(o.year,1,1),hist:[]};
G.vac.forEach(v=>v.dl=d0+14+Math.floor(rnd()*14));log('Welcome to LIFECRAFT. You have £0, a relative’s spare room and two weeks of home-cooked meals.')}
function led(a,amt,desc,cat,type,ref){G[a]+=amt;G.led.push({d:G.day,desc,cat,amt,acct:a,type,ref,bal:G[a]})}
function spend(a,desc,cat){if(G.bank>=a)led('bank',-a,desc,cat,'purchase','Card');else if(G.cash>=a)led('cash',-a,desc,cat,'purchase','Cash');else{tr='Not enough money.';return false}return true}
function bill(a,desc,cat){if(G.bank>=a)led('bank',-a,desc,cat,'direct debit',desc);else{G.arrears.push({desc,a,cat});G.st.stress=cl(G.st.stress+8);log('Payment failed: '+desc+' ('+M(a)+'). Added to arrears.',1)}}
const liab=()=>G.arrears.reduce((s,x)=>s+x.a,0)+(G.cars||[]).reduce((s,c)=>s+(c.loan?c.loan.bal:0),0)+propL()+bizL()+instL()+planL()+loansL(),nw=()=>G.cash+G.bank+(G.tn?G.tn.dep:0)+(G.sav||0)+pfv()+fxv()+carV()+propV()+bizV()+pnV()+fcyV()+oppV()+rsV()+itemsV()-liab();
const isWork=n=>!G.pr&&G.job&&n>=G.job.start&&dt(n).getUTCDay()%6!=0,slots=()=>(isWork(G.day)?2:5)-G.used;
function pay(g){const c=(typeof CX=='function'&&CX())||{},x=Math.max(0,g-104800),tax=Math.round(x*(c.tx==null?.2:c.tx)),ni=Math.round(x*(c.ni==null?.08:c.ni));return{tax,ni,net:g-tax-ni}}
function needs(w){const s=G.st;G.food=G.food.filter(b=>{if(b.exp<G.day&&b.n>0)log('Food expired: '+b.n+' meals wasted.');return b.exp>=G.day&&b.n>0});
if(G.food.length){const b=G.food[0];b.n--;if(b.t)s.happy=cl(s.happy+b.t);s.health=cl(s.health+(b.hp||0)+.5);G.food=G.food.filter(b=>b.n>0)}else{s.health=cl(s.health-3);s.happy=cl(s.happy-4);s.energy=cl(s.energy-5);G.hung=1}
s.energy=cl(s.energy+25-(w?15:0));s.stress=cl(s.stress-2+(w?1:0)+(G.arrears.length?2:0));if(s.stress>80)s.health=cl(s.health-1);if(!G.food.length&&G.hung){log('You went hungry today.',0)}}
function payday(){if(!G.job||!G.worked&&!G.absM)return;const j=G.job,g=Math.round(G.worked*j.r),p=pay(g);
G.slips.unshift({d:G.day,h:G.worked,gross:g,tax:p.tax,ni:p.ni,net:p.net,emp:j.e});if(p.net>0)led('bank',p.net,'Salary – '+j.e,'Income','salary','Payslip '+fmt(G.day));
log('Payday! Net pay '+M(p.net)+' for '+G.worked.toFixed(1)+' hours.',1);G.worked=0;
if(G.absM>=3){j.warn=(j.warn||0)+1;log('Written warning for absence ('+G.absM+' missed shifts).',1)}G.absM=0;
if((j.warn||0)>=2){log('You have been dismissed for poor attendance.',1);G.job=null}}
function score(a){const v=G.vac.find(x=>x.id==a.vid),c=G.cv;let s=35+(c.sk.includes(v.sk)?20:0)+EDU[G.edu]+(G.quals||[]).length*4+Math.min(c.x,3)*4-convPen(v)+(typeof styleBonus=='function'?styleBonus():0)+a.q*5+c.sk.length*3+(c.ref?6:0)+rnd()*25-v.df-15*Math.max(0,v.x-c.x);return s-(G.diff=='hard'?8:G.diff=='easy'?-8:0)}
function qrun(){G.q.sort((a,b)=>a.d-b.d);while(G.q.length&&G.q[0].d<=G.day){const e=G.q.shift(),a=G.apps[e.a],v=G.vac.find(x=>x.id==a.vid);
if(e.t=='res'){a.sc=score(a);if(a.sc>=60){a.st='Interview invited';G.invites.push({a:e.a,dl:G.day+4});log('Interview invitation from '+v.e+' (reply within 4 days).',1)}else{a.st='Rejected';log('Rejected: '+v.t+' at '+v.e+'.',1)}}
else if(e.t=='off'){if(a.sc+a.iv-60+rnd()*10>=12+v.df/2){a.st='Offer';G.offers.push({a:e.a,vid:v.id,r:v.r,h:v.h,dl:G.day+5,neg:0});log('Job offer from '+v.e+'! Review the contract.',1)}else{a.st='Rejected after interview';log('Unsuccessful after interview at '+v.e+'.',1)}}}}
const EV=[{c:()=>G.bank+G.cash<2500&&G.day>G.d0+5,f:()=>{led('bank',2500,'Gift from relative','Gift','income','Family');log('A relative sends you £25 to help out.',1)},w:3},
{c:()=>1,f:()=>{G.dec={t:'A friend invites you out for dinner (£15).',o:[['Go',1500,{happy:8,stress:-5},'Social'],['Decline',0,{happy:-2},'']]}},w:3},
{c:()=>1,f:()=>{G.dec={t:'Your phone screen cracks.',o:[['Repair (£40)',4000,{},'Phone'],['Live with it',0,{happy:-5,stress:3},'']]}},w:2},
{c:()=>1,f:()=>{G.st.health=cl(G.st.health-8);G.st.energy=cl(G.st.energy-15);log('You catch a cold.',1)},w:2}];
function morning(){G.used=0;G.hung=0;const d=dt(G.day),dm=d.getUTCDate();
for(let i=G.arrears.length-1;i>=0;i--){const x=G.arrears[i];if(G.bank>=x.a){led('bank',-x.a,x.desc+' (arrears cleared)',x.cat,'debit','Arrears');G.arrears.splice(i,1);log('Arrears paid: '+x.desc)}}
if(G.day>=G.firstBill){if(dm==1)bill(Math.round((G.sc=='rel'?12000:21000)*G.m),G.sc=='rel'?'Board to relative':'Hostel charge','Housing');if(dm==15)bill(Math.round(1200*G.m),'Mobile phone','Communication')}
if(G.claim&&G.day==G.nextJsa){if(G.job&&G.job.start<=G.day){G.claim=false;log('Allowance claim closed – you are working.')}else{const n=G.apps.filter(a=>a.d>G.day-14).length;
if(n>=1){led('bank',14580,'Jobseeker’s Allowance','Benefits','income','Job Centre');log('Jobseeker’s Allowance £145.80 paid.',1)}else log('Allowance withheld: no job applications in the last 14 days.',1);G.nextJsa+=14}}
G.vac.forEach(v=>{if(v.dl<G.day)v.dl=G.day+14+Math.floor(rnd()*14)});
G.invites=G.invites.filter(i=>{if(i.dl<G.day){G.apps[i.a].st='Interview missed';log('You missed an interview invitation.',1);return false}return true});
G.offers=G.offers.filter(o=>{if(o.dl<G.day){G.apps[o.a].st='Offer expired';log('A job offer expired.',1);return false}return true});
qrun();if(!G.dec&&rnd()<(G.diff=='easy'?.09:G.diff=='hard'?.05:.07)){const p=EV.filter(e=>e.c());let t=p.reduce((s,e)=>s+e.w,0)*rnd();for(const e of p){t-=e.w;if(t<=0){e.f();break}}}}
function step(){const wk=dt(G.day).getUTCDay()%6!=0;let w=false;
if(G.job&&G.day>=G.job.start&&wk){if(G.sick){G.job.abs=(G.job.abs||0)+1;G.absM++;log('Called in sick – unpaid.')}else{G.worked+=G.job.h/5;w=true}}
G.sick=false;needs(w);if(isLast(G.day))payday();G.hist.push(G.day);G.day++;morning()}
function adv(n,to){G.stop=false;tr='';if(G.dec){tr='Resolve the pending decision first.';return render()}
for(let i=0;i<(to||n);i++){if(to&&G.day>=to)break;if(!to&&n==0)break;step();if(G.stop||G.dec)break}
save();render()}
function nextEv(){G.stop=false;if(G.dec){tr='Resolve the pending decision first.';return render()}
for(let i=0;i<60;i++){step();if(G.stop||G.dec||isLast(G.day-1)||dt(G.day).getUTCDate()==1)break}save();render()}
function toDate(){const v=document.getElementById('td').value;if(!v)return;const t=Math.floor(Date.parse(v)/864e5);if(t<=G.day){tr='Pick a future date.';return render()}adv(0,t)}
function actn(k){if(slots()<=0){tr='No time slots left today – advance the day.';return render()}const s=G.st;G.used++;
if(k=='ex'){s.energy=cl(s.energy-10);s.health=cl(s.health+2);s.stress=cl(s.stress-5);s.happy=cl(s.happy+2)}if(k=='rest'){s.energy=cl(s.energy+15);s.stress=cl(s.stress-3)}if(k=='soc'){s.happy=cl(s.happy+4);s.stress=cl(s.stress-2);s.rep=cl(s.rep+1)}
tr='Done.';render()}
function saveCV(){const c=G.cv;c.sk=SKL.filter((s,i)=>document.getElementById('sk'+i).checked);c.x=+document.getElementById('cx').value||0;c.ref=document.getElementById('cr').checked;c.built=true;tr='CV saved.';render()}
function apply(id){if(!G.cv.built){tr='Create your CV first.';return render()}if(slots()<=0){tr='No time slots left today.';return render()}
if(G.apps.some(a=>a.vid==id&&['Submitted','Interview invited','Offer'].includes(a.st))){tr='Already applied.';return render()}
const q=+document.getElementById('cl').value;G.used++;G.apps.push({vid:id,d:G.day,q,st:'Submitted'});G.q.push({d:G.day+3+Math.floor(rnd()*4),t:'res',a:G.apps.length-1});tr='Application submitted.';render()}
function claim(){G.claim=true;G.nextJsa=G.day+7;log('Jobseeker’s Allowance claim made. First payment in 7 days (needs ≥1 application per fortnight).');render()}
function attend(i){if(slots()<=0){tr='No time slots left today.';return render()}G.used++;const iv=G.invites.splice(i,1)[0];G.int={a:iv.a,k:0,sum:0};render()}
function ans(v){G.int.sum+=v;G.int.k++;if(G.int.k>=Q.length){const a=G.apps[G.int.a];a.iv=G.int.sum;a.st='Interviewed';G.q.push({d:G.day+2,t:'off',a:G.int.a});log('Interview done. Decision expected in ~2 days.');G.int=null}render()}
function accept(i){const o=G.offers[i],v=G.vac.find(x=>x.id==o.vid);let s=G.day+3;while(dt(s).getUTCDay()%6==0)s++;
G.job={vid:v.id,t:v.t,e:v.e,r:o.r,h:o.h,start:s,warn:0,abs:0};G.apps[o.a].st='Accepted';G.offers=[];G.invites=[];log('You accepted the job at '+v.e+'. Start date: '+fmt(s)+'.',1);render()}
function neg(i){const o=G.offers[i];if(o.neg)return;o.neg=1;if(rnd()<.55){o.r+=50;tr='Negotiated +£0.50/hour.'}else if(rnd()<.2){G.apps[o.a].st='Offer withdrawn';G.offers.splice(i,1);tr='They withdrew the offer.'}else tr='They declined to move on pay.';render()}
function decl(i){G.apps[G.offers[i].a].st='Declined';G.offers.splice(i,1);render()}
function resign(){log('You resigned from '+G.job.e+'.');G.job=null;render()}
function sick(){G.sick=true;tr='You will call in sick for today.';render()}
function dec(i){const o=G.dec.o[i];if(o[1]&&!spend(o[1],G.dec.t.slice(0,30),o[3]||'Other'))return render();for(const k in o[2])G.st[k]=cl(G.st[k]+o[2][k]);G.dec=null;tr='';render()}
function buy(i){const s=SHOP[i];if(!spend(s[1],s[0].split(' –')[0],'Food'))return render();G.food.push({n:s[2],exp:G.day+s[3],hp:s[4],t:s[5]});tr='Bought.';render()}
function xfer(d){const v=Math.round(+document.getElementById('xa').value*100);if(!(v>0))return;const f=d?'cash':'bank',t=d?'bank':'cash';if(G[f]<v){tr='Insufficient funds.';return render()}
led(f,-v,d?'Cash deposit':'Cash withdrawal','Transfer','transfer','Own accounts');led(t,v,d?'Cash deposit':'Cash withdrawal','Transfer','transfer','Own accounts');tr='';render()}
function save(k){try{localStorage.setItem(k||SK,JSON.stringify(G))}catch(e){}}
function load(k){try{const s=localStorage.getItem(k||SK);if(s){G=JSON.parse(s);return true}}catch(e){}return false}
function start(){const g=id=>document.getElementById(id).value;newGame({name:g('nm')||'Alex',age:+g('ag'),edu:g('ed'),diff:g('df'),year:+g('yr'),sc:g('sc')});save();tab='home';render()}
function imp(){try{G=JSON.parse(document.getElementById('ex').value);save();render()}catch(e){tr='Invalid save data.';render()}}
const bar=(l,v)=>`<div class="m">${l} ${v}</div><div class="bar"><i style="width:${v}%"></i></div>`;
function mon(){const d=dt(G.day),y=d.getUTCFullYear(),m=d.getUTCMonth();let i=0,e=0;G.led.forEach(x=>{const t=dt(x.d);if(t.getUTCFullYear()==y&&t.getUTCMonth()==m&&x.cat!='Transfer'&&(x.acct=='bank'||x.acct=='cash')&&x.cat!='Investments'){x.amt>0?i+=x.amt:e-=x.amt}});return[i,e]}
function view(){const s=G.st,[mi,me]=mon(),age=G.age+Math.floor((G.day-G.d0)/365.25),d=dt(G.day),se=['Winter','Spring','Summer','Autumn'][Math.floor(((d.getUTCMonth()+1)%12)/3)];
if(tab=='home'){const goals=[['Get a first job',!!G.job],['Save £1,000',G.bank+G.cash>=1e5],['Survive a month with no arrears',G.day>=G.d0+31&&!G.arrears.length]];
const nxt=[];const nm=dN(d.getUTCFullYear(),d.getUTCMonth()+1,1);if(G.day<G.firstBill)nxt.push('Bills start '+fmt(G.firstBill));else nxt.push('Rent/board due '+fmt(nm));
if(G.job)nxt.push('Payday '+fmt(Math.floor(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)/864e5)));if(G.claim)nxt.push('Allowance '+fmt(G.nextJsa));G.invites.forEach(i=>nxt.push('Interview reply by '+fmt(i.dl)));G.offers.forEach(o=>nxt.push('Offer expires '+fmt(o.dl)));
const sl=slots();
return`<div class="c"><h2>🧑 ${G.name}, ${age}</h2><div class="m">${G.job?G.job.t+' @ '+G.job.e:'Unemployed'} · ${G.tn?G.tn.n:G.sc=='rel'?'With relative':'Hostel'} · UK</div>
<div class="r"><b>${fmt(G.day)}</b><span class="m">${se} · ${G.diff}</span></div><div class="m">Time today: ${sl>0?'🟢'.repeat(sl):'No slots left'} ${isWork(G.day)?'(working day – evening only)':''}</div></div>
${G.dec?`<div class="c" style="border-color:var(--ac)"><h3>Decision</h3>${G.dec.t}<br>${G.dec.o.map((o,i)=>`<button onclick="dec(${i})">${o[0]}</button>`).join('')}</div>`:''}
${G.int?`<div class="c"><h3>Interview</h3><b>${Q[G.int.k][0]}</b><br>${Q[G.int.k][1].map(o=>`<button class="s" onclick="ans(${o[1]})">${o[0]}</button>`).join('')}</div>`:''}
<div class="c"><h3>Money</h3><div class="g"><div>Cash<br><b>${M(G.cash)}</b></div><div>Bank<br><b>${M(G.bank)}</b></div><div>Liabilities<br><b class="${liab()?'bad':''}">${M(liab())}</b></div><div>Net worth<br><b>${M(nw())}</b></div></div><div class="m">This month: in ${M(mi)} · out ${M(me)}</div></div>
<div class="c"><h3>Advance time</h3><button onclick="adv(1)">Next day</button><button onclick="nextEv()">To next event</button><button class="s" onclick="adv(7)">+1 week</button>
<div class="g"><input type="date" id="td"><button class="s" onclick="toDate()">Go to date</button></div><div class="m">Stops for decisions, offers, interviews and bills. Hourly stepping: coming later.</div></div>
<div class="c"><h3>Today</h3><button class="s" onclick="actn('ex')">Exercise</button><button class="s" onclick="actn('rest')">Rest</button><button class="s" onclick="actn('soc')">Socialise</button>${G.job?`<button class="s" onclick="sick()">Call in sick</button>`:''}
